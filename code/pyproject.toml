[project]
name = "paper-odca-des-code"
version = "0.1.0"
description = "paper-odca-des experiments and figures (TR Part B); the simulator is the odca-des package"
requires-python = ">=3.10"
dependencies = [
    "odca-des[viewer]",
    "simpy>=4.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pygame>=2.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
odca-des = { path = "../../odca-des", editable = true }
